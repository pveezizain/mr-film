<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MR Film · Architecture</title>
<style>
  :root {
    --bg: #0f1115;
    --panel: #181b22;
    --text: #f2f2f2;
    --muted: #9aa3b2;
    --accent: #f5a524;
    --line: #2a2f3a;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 32px 20px;
  }
  .wrap { width: 100%; max-width: 960px; }
  header h1 { font-size: 28px; margin: 0 0 6px; }
  header p { color: var(--muted); margin: 0 0 28px; font-size: 15px; }

  .flow {
    display: flex;
    align-items: stretch;
    gap: 8px;
    margin-bottom: 28px;
    flex-wrap: wrap;
  }
  .node {
    flex: 1 1 140px;
    padding: 14px 10px;
    border: 2px solid var(--line);
    border-radius: 10px;
    text-align: center;
    font-size: 14px;
    color: var(--muted);
    transition: all .3s ease;
  }
  .node.active {
    border-color: var(--accent);
    color: var(--text);
    background: var(--panel);
    box-shadow: 0 0 0 4px rgba(245,165,36,.15);
  }
  .arrow {
    align-self: center;
    color: var(--muted);
    font-size: 18px;
  }

  .card {
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 14px;
    padding: 28px;
    min-height: 220px;
  }
  .step-label {
    color: var(--accent);
    font-size: 13px;
    letter-spacing: .08em;
    text-transform: uppercase;
    margin-bottom: 8px;
  }
  .card h2 { font-size: 22px; margin: 0 0 12px; }
  .card p { font-size: 16px; line-height: 1.6; margin: 0 0 12px; color: #d8dce4; }
  .card ul { margin: 0; padding-left: 20px; color: #d8dce4; line-height: 1.7; }

  .controls {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-top: 20px;
  }
  button {
    background: transparent;
    color: var(--text);
    border: 1px solid var(--line);
    border-radius: 8px;
    padding: 10px 18px;
    font-size: 15px;
    cursor: pointer;
  }
  button:hover:not(:disabled) { border-color: var(--accent); color: var(--accent); }
  button:disabled { opacity: .35; cursor: default; }
  .dots { display: flex; gap: 8px; }
  .dot {
    width: 10px; height: 10px;
    border-radius: 50%;
    background: var(--line);
    cursor: pointer;
  }
  .dot.active { background: var(--accent); }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>MR Film · How it works</h1>
    <p>Each question travels from the viewer's browser to Muse Spark and back.</p>
  </header>

  <div class="flow" id="flow">
    <div class="node" data-node="0">Viewer's browser</div>
    <div class="arrow">→</div>
    <div class="node" data-node="1">Story data</div>
    <div class="arrow">→</div>
    <div class="node" data-node="2">Local server</div>
    <div class="arrow">→</div>
    <div class="node" data-node="3">Muse Spark 1.3</div>
  </div>

  <div class="card">
    <div class="step-label" id="stepLabel"></div>
    <h2 id="stepTitle"></h2>
    <div id="stepBody"></div>
  </div>

  <div class="controls">
    <button id="prev">← Back</button>
    <div class="dots" id="dots"></div>
    <button id="next">Next →</button>
  </div>
</div>

<script>
  const steps = [
    {
      node: 0,
      title: "The viewer's browser",
      body: "<p>The page, the Tasik scene, the markers and the guide panel all run on the viewer's own computer. Nothing here needs a special install.</p>"
    },
    {
      node: 1,
      title: "The story data",
      body: "<p>Scene descriptions and obstacle notes are stored with the project. When the viewer asks the guide a question, only the notes for the current scene are sent along with it.</p>"
    },
    {
      node: 2,
      title: "The local server",
      body: "<p>A small server, <strong>server.py</strong>, runs on the same computer. It holds the API key, so the key is never sent to the browser or shown to the viewer.</p>"
    },
    {
      node: 3,
      title: "Muse Spark 1.3",
      body: "<p>The server sends the question and the scene notes to Meta's Muse Spark 1.3 model. The model answers using only that story context.</p>"
    },
    {
      node: 0,
      title: "The answer returns to the viewer",
      body: "<p>The answer appears in the guide panel. If the internet or the model is unavailable, the guide falls back to answers stored in the story notes, and those answers are marked as offline.</p>"
    }
  ];

  let current = 0;
  const flow = document.getElementById("flow");
  const nodes = flow.querySelectorAll(".node");
  const dotsEl = document.getElementById("dots");
  const label = document.getElementById("stepLabel");
  const title = document.getElementById("stepTitle");
  const body = document.getElementById("stepBody");
  const prev = document.getElementById("prev");
  const next = document.getElementById("next");

  steps.forEach((_, i) => {
    const d = document.createElement("div");
    d.className = "dot";
    d.addEventListener("click", () => show(i));
    dotsEl.appendChild(d);
  });

  function show(i) {
    current = Math.max(0, Math.min(steps.length - 1, i));
    const s = steps[current];
    label.textContent = "Step " + (current + 1) + " of " + steps.length;
    title.textContent = s.title;
    body.innerHTML = s.body;
    nodes.forEach(n => n.classList.toggle("active", Number(n.dataset.node) === s.node));
    dotsEl.querySelectorAll(".dot").forEach((d, idx) => d.classList.toggle("active", idx === current));
    prev.disabled = current === 0;
    next.disabled = current === steps.length - 1;
  }

  prev.addEventListener("click", () => show(current - 1));
  next.addEventListener("click", () => show(current + 1));
  document.addEventListener("keydown", e => {
    if (e.key === "ArrowRight") show(current + 1);
    if (e.key === "ArrowLeft") show(current - 1);
  });

  show(0);
</script>
</body>
</html>
